<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid-Adha Mubarak Carousel with Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="starsContainer"></div>

    <div class="bunting">
        <div class="flag flag-pink"></div>
        <div class="flag flag-green"></div>
        <div class="flag flag-blue"></div>
        <div class="flag flag-yellow"></div>
        <div class="flag flag-red"></div>
        <div class="flag flag-purple"></div>
    </div>

    <div class="container">
        <h1 class="eid-text">Eid-Adha<br>Mubarak</h1>
        
        <div class="animal-container">
            
            <div class="animal sheep active">
                <div class="body sheep-body">
                    <div class="head sheep-head">
                        <div class="ear-l"></div><div class="ear-r"></div>
                        <div class="eye-l"></div><div class="eye-r"></div>
                        <div class="blush-l"></div><div class="blush-r"></div>
                        <div class="nose"></div>
                    </div>
                </div>
                <div class="legs">
                    <div class="leg"></div><div class="leg"></div>
                    <div class="leg"></div><div class="leg"></div>
                </div>
            </div>

            <div class="animal cow">
                <div class="body cow-body">
                    <div class="spot spot1"></div><div class="spot spot2"></div>
                    <div class="head cow-head">
                        <div class="horn-l"></div><div class="horn-r"></div>
                        <div class="cow-ear-l"></div><div class="cow-ear-r"></div>
                        <div class="eye-l"></div><div class="eye-r"></div>
                        <div class="cow-snout"></div>
                    </div>
                </div>
                <div class="legs">
                    <div class="leg cow-leg"></div><div class="leg cow-leg"></div>
                    <div class="leg cow-leg"></div><div class="leg cow-leg"></div>
                </div>
            </div>

            <div class="animal camel">
                <div class="camel-neck">
                    <div class="head camel-head">
                        <div class="eye-l"></div><div class="eye-r"></div>
                        <div class="camel-snout"></div>
                    </div>
                </div>
                <div class="body camel-body">
                    <div class="hump"></div>
                </div>
                <div class="legs">
                    <div class="leg camel-leg"></div><div class="leg camel-leg"></div>
                    <div class="leg camel-leg"></div><div class="leg camel-leg"></div>
                </div>
            </div>

        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
        আপনার ব্রাউজারটি অ디오 সাপোর্ট করে না।
    </audio>

    <script src="script.js"></script>
</body>
</html>
